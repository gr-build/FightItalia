name: Live evento

on:
  schedule:
    - cron: "*/10 * * * *" # ogni 10 minuti, tutto l'anno
  workflow_dispatch: {} # permette anche il lancio manuale da GitHub

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  aggiorna-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # live.py ha la sola dipendenza "requests" (vedi il file): niente
      # pandas/bs4/lxml/Playwright, per restare veloce su un workflow che
      # gira ogni 10 minuti 24 ore su 24.
      - name: Installa dipendenze
        run: pip install requests

      - name: Aggiorna live.json
        run: python live.py

      - name: Commit e push se cambia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/live.json
          if git diff --staged --quiet; then
            echo "Nessuna novita' da committare."
          else
            git commit -m "Aggiorna live.json [automatico]"
            git pull --rebase origin main || true
            git push
          fi
