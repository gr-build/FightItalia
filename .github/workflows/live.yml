name: Live evento

on:
  schedule:
    - cron: "*/15 * * * 5,6,0" # ogni 15 minuti, solo venerdi', sabato e domenica (UTC): gli eventi UFC sono nel weekend. Altri giorni: lancio manuale
  workflow_dispatch: {} # permette anche il lancio manuale da GitHub

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  aggiorna-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # live.py ha la sola dipendenza "requests" (vedi il file): niente
      # pandas/bs4/lxml/Playwright, per restare veloce su un workflow che
      # gira ogni 15 minuti nel weekend.
      - name: Installa dipendenze
        run: pip install requests

      - name: Aggiorna live.json
        run: python live.py

      # Risultati degli incontri appena finiti (metodo, round, tempo) da Wikipedia e schede incontro
      # subito, senza aspettare l'aggiornamento giornaliero. Solo requests + libreria standard.
      - name: Risultati dell'evento e schede incontro
        run: |
          python risultati_live.py | tee /tmp/risultati.txt
          if grep -q CAMBIATO /tmp/risultati.txt; then python build_static.py; fi

      - name: Commit e push se cambia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/live.json docs/data/eventi docs/data/incontri.json docs/evento docs/incontro
          if git diff --staged --quiet; then
            echo "Nessuna novita' da committare."
          else
            git commit -m "Aggiorna live.json [automatico]"
            git pull --rebase origin main || true
            git push
          fi
