name: Radar notizie

# Agente News + agente Social (vedi radar.py): ogni 30 minuti legge le fonti,
# da' un voto alle notizie e manda su Telegram quelle forti con i testi
# pronti. La memoria delle notizie gia' viste (radar/stato.json) vive nella
# cache di Actions, non nel repo: niente commit ogni mezz'ora.
on:
  schedule:
    - cron: "7,37 * * * *" # ogni 30 minuti, sfasato dagli altri workflow
  workflow_dispatch: {}

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests feedparser beautifulsoup4

      - name: Ripristina la memoria del radar
        uses: actions/cache@v4
        with:
          path: radar/stato.json
          key: radar-stato-${{ github.run_id }}
          restore-keys: |
            radar-stato-

      - name: Radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "559225883"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python radar.py
