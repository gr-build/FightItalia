<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMA Oggi — Ranking UFC</title>
<meta name="description" content="Il ranking ufficiale UFC per categoria di peso, uomini e donne, e la pound-for-pound. Aggiornato da ufc.com.">
<link rel="icon" type="image/png" href="img/favicon-64.png?v=2">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>

<header id="site-header" class="site-header"></header>

<section class="hero">
  <div class="container">
    <h1>Il <span class="accent">Ranking</span></h1>
    <p>Il ranking ufficiale UFC, categoria per categoria: chi sfida chi, e chi si avvicina al titolo.</p>

</section>

    <select id="rank-select"></select>

  <p id="rank-vuoto" class="empty-state" hidden>Ranking non disponibile al momento. Riprova più tardi.</p>
  <p class="note" style="margin:20px 0 60px; font-size:12px; color:var(--text-muted);" id="rank-nota"></p>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script type="module" src="js/ranking.js?v=202609261139"></script>
