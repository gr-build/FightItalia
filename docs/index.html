<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="img/favicon-64.png?v=2">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=2">
<title>MMA Oggi — Calendario Eventi UFC e Database Statistiche in Italiano</title>
<meta name="description" content="Calendario eventi UFC aggiornato con orari in Italia, e il database completo di statistiche, record e confronti su tutti i lottatori. Il riferimento in Italia per gli appassionati UFC.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MMA Oggi">
<meta property="og:title" content="MMA Oggi — Calendario Eventi UFC e Database Statistiche in Italiano">
<meta property="og:description" content="Calendario eventi UFC aggiornato con orari in Italia, e il database completo di statistiche, record e confronti su tutti i lottatori. Il riferimento in Italia per gli appassionati UFC.">
<meta property="og:image" content="https://mmaoggi.it/og-image.png">
<meta property="og:url" content="https://mmaoggi.it/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="MMA Oggi — Calendario Eventi UFC e Database Statistiche in Italiano">
<meta name="twitter:description" content="Calendario eventi UFC aggiornato con orari in Italia, e il database completo di statistiche, record e confronti su tutti i lottatori. Il riferimento in Italia per gli appassionati UFC.">
<meta name="twitter:image" content="https://mmaoggi.it/og-image.png">
<link rel="canonical" href="https://mmaoggi.it/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202609251251">
<script defer data-domain="mmaoggi.it" src="https://plausible.io/js/script.js"></script>
</head>
<body>

<header id="site-header" class="site-header"></header>

<section class="hero">
  <div class="container">
    <h1>MMA <span class="accent">Oggi</span>: eventi e statistiche UFC</h1>
    <p>Calendario aggiornato con gli orari in Italia, e il database più completo di lottatori e confronti.</p>
    <div class="stat-strip" id="stat-strip"></div>
  </div>
</section>

<div class="container">
  <div class="org-tabs" role="tablist" aria-label="Vista home">
    <button type="button" class="org-tab active" id="switch-eventi" role="tab" aria-selected="true">📅 Eventi</button>
    <button type="button" class="org-tab" id="switch-lottatori" role="tab" aria-selected="false">🥊 Lottatori</button>
  </div>

  <div id="vista-eventi">
    <div class="section-title">In arrivo</div>
    <div id="eventi-prossimi"></div>
    <div class="dazn-note">In Italia gli eventi UFC si seguono in streaming legale su discovery+ (e in parte su Eurosport).</div>

    <div class="section-title">Passati <span class="count" id="passati-count"></span></div>
    <form class="filtri-eventi" id="filtri-eventi" role="search" onsubmit="return false">
      <label class="filtro-cerca">
        <span class="sr-only">Cerca evento</span>
        <input type="search" id="cerca-evento" placeholder="Cerca: UFC 300, Poirier, Las Vegas…" autocomplete="off">
      </label>
      <label>
        <span class="sr-only">Anno</span>
        <select id="filtro-anno"><option value="">Tutti gli anni</option></select>
      </label>
      <label>
        <span class="sr-only">Data</span>
        <input type="date" id="filtro-data" title="Cerca per data (± 3 giorni)">
      </label>
      <label>
        <span class="sr-only">Tipo</span>
        <select id="filtro-tipo">
          <option value="">Tutti i tipi</option>
          <option value="Numerato">Numerati</option>
          <option value="Fight Night">Fight Night</option>
        </select>
      </label>
    </form>
    <div id="eventi-passati"></div>
    <button class="load-more" id="load-more">Mostra altri eventi</button>
  </div>

  <div id="vista-lottatori" hidden>
    <div class="lottatori-layout">
      <div class="lottatori-main">
        <div class="section-title" style="margin-top:24px;">In evidenza</div>
        <div id="in-evidenza" class="champ-grid" style="grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));"></div>
        <p id="riassunto-nota" style="font-size:12px; color:var(--text-muted); margin:-6px 0 0;"></p>

        <div class="filter-bar">
          <div class="search-input">
            <span id="search-icon"></span>
            <input id="search" type="text" placeholder="Cerca un lottatore...">
          </div>
          <div id="category-pills" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        </div>

        <div class="section-title">Lottatori <span class="count" id="result-count"></span></div>
        <div class="fighter-grid" id="fighter-grid"></div>
      </div>

      <aside class="lottatori-aside">
        <div class="section-title" style="margin-top:24px;">Prossimi eventi</div>
        <div id="prossimi-mini"></div>
        <button type="button" class="load-more" id="vedi-tutti-eventi">Vedi tutti gli eventi →</button>
      </aside>
    </div>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script type="module" src="js/eventi.js?v=202609251251"></script>
<script type="module" src="js/roster.js?v=202609251251"></script>
<script type="module" src="js/home-switch.js?v=202609251251"></script>
</body>
</html>
