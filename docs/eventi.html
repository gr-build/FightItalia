<head>
<meta charset="utf-8">

<title>MMA Oggi — Calendario ed Eventi UFC in Italiano</title>
<meta name="description" content="Calendario eventi UFC aggiornato: prossimi appuntamenti MMA in ordine cronologico, risultati passati e orari in Italia per ogni card UFC.">

<meta property="og:site_name" content="MMA Oggi">
<meta property="og:title" content="MMA Oggi — Calendario ed Eventi UFC in Italiano">
<meta property="og:description" content="Calendario eventi UFC aggiornato: prossimi appuntamenti MMA in ordine cronologico, risultati passati e orari in Italia per ogni card UFC.">
<meta property="og:image" content="https://mmaoggi.it/og-image.png">
<meta property="og:url" content="https://mmaoggi.it/eventi.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="MMA Oggi — Calendario ed Eventi UFC in Italiano">
<meta name="twitter:description" content="Calendario eventi UFC aggiornato: prossimi appuntamenti MMA in ordine cronologico, risultati passati e orari in Italia per ogni card UFC.">

<link rel="canonical" href="https://mmaoggi.it/eventi.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202609260950">
<script defer data-domain="mmaoggi.it" src="https://plausible.io/js/script.js"></script>
</head>
<body>

<header id="site-header" class="site-header"></header>

<section class="hero">
  <div class="container">
    <h1>Calendario eventi <span class="accent">UFC</span></h1>
    <p>Prossimi eventi programmati ed eventi recenti, con sede e link di approfondimento.</p>
  </div>
</section>

<div class="container">
  <div class="section-title">In arrivo</div>
  <div id="eventi-prossimi"></div>
  <div class="dazn-note">In Italia gli eventi UFC si seguono in streaming legale su discovery+ (e in parte su Eurosport).</div>

  <div class="section-title">Passati <span class="count" id="passati-count"></span></div>
  <form class="filtri-eventi" id="filtri-eventi" role="search" onsubmit="return false">
    <label class="filtro-cerca">
      <span class="sr-only">Cerca evento</span>
      <input type="search" id="cerca-evento" placeholder="Cerca: UFC 300, Poirier, Las Vegas…" autocomplete="off">
    </label>
    <label>
      <span class="sr-only">Anno</span>
      <select id="filtro-anno"><option value="">Tutti gli anni</option></select>
    </label>
    <label>
      <span class="sr-only">Data</span>
      <input type="date" id="filtro-data" title="Cerca per data (± 3 giorni)">
    </label>
    <label>
      <span class="sr-only">Tipo</span>
      <select id="filtro-tipo">
        <option value="">Tutti i tipi</option>
        <option value="Numerato">Numerati</option>
        <option value="Fight Night">Fight Night</option>
      </select>
    </label>
  </form>
  <div id="eventi-passati"></div>
  <button class="load-more" id="load-more">Mostra altri eventi</button>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script type="module" src="js/eventi.js?v=202609260950"></script>
</body>
</html>
